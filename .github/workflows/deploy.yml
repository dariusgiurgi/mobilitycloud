name: Production deploy

on:
  workflow_run:
    workflows:
      - Quality gate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy verified main
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    steps:
      - name: Configure production SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MOBILITYCLOUD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MOBILITYCLOUD_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/mobilitycloud"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/mobilitycloud" "$HOME/.ssh/known_hosts"

      - name: Deploy the verified revision
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          ssh \
            -i "$HOME/.ssh/mobilitycloud" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            mobilityadmin@mobilitycloud.eu \
            "sudo EXPECTED_SHA='$EXPECTED_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd /var/www/mobilitycloud
          runuser -u deploy -- git fetch --prune origin main
          test "$(runuser -u deploy -- git rev-parse origin/main)" = "$EXPECTED_SHA"
          script="$(mktemp /tmp/mobilitycloud-deploy.XXXXXX)"
          trap 'rm -f "$script"' EXIT
          runuser -u deploy -- git show "$EXPECTED_SHA:deploy/production.sh" > "$script"
          bash "$script"
          REMOTE

      - name: Verify production health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://mobilitycloud.eu/up
