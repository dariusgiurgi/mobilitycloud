name: Quality gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: PHP tests (${{ matrix.database }})
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mariadb]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: testing-only
          MARIADB_DATABASE: mobilitycloud_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'mobilitycloud_test' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: testing-only
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, sqlite3, zip, gd, sodium
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify deployment rollback paths
        run: python3 tests/deploy/test_production.py

      - name: Validate Composer metadata
        run: composer validate --strict --no-interaction

      - name: Check PHP style
        run: vendor/bin/pint --test

      - name: Run application tests
        run: composer test

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend assets
        run: npm run build

  browser:
    name: Browser workflows and downloads
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: local
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/mobilitycloud-e2e.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # setup-php enables JIT by default; production runs without JIT.
          ini-values: opcache.jit=disable, opcache.jit_buffer_size=0
          extensions: mbstring, intl, pdo_sqlite, sqlite3, zip, gd, sodium
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run isolated browser suite
        run: |
          touch "$DB_DATABASE"
          php artisan migrate --force --no-interaction
          # Production compiles Blade views before accepting requests.
          php artisan view:cache --no-interaction
          php artisan serve --host=127.0.0.1 --port=8000 --no-reload > /tmp/http.log 2>&1 &
          http_pid=$!
          php artisan queue:work database --queue=exports,default --sleep=1 --tries=2 --timeout=900 > /tmp/queue.log 2>&1 &
          queue_pid=$!
          trap 'kill "$http_pid" "$queue_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/up >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            output/playwright-results
            output/playwright-report
            /tmp/http.log
            /tmp/queue.log
            storage/logs/*.log
          retention-days: 7

  quality:
    name: PHP tests and quality
    if: always()
    needs: [backend, frontend, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality check
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$BROWSER_RESULT" = success
