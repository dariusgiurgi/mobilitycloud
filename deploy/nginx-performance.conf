# Include inside the mobilitycloud.eu TLS server block.
# Keep security headers inherited: do not add_header inside static locations.
client_max_body_size 64M;
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

location ~* ^/(?:build|css|js|fonts|brand)/.*\.(?:css|js|woff2?|png|jpe?g|webp|svg|ico)$ {
    expires 30d;
    try_files $uri =404;
}

# Files can only be reached after the application has authorized a download.
location /_protected_archives/ {
    internal;
    alias /var/www/mobilitycloud/storage/app/private/final-archives/;
}
