[program:mobilitycloud-exports]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/mobilitycloud/artisan queue:work database --queue=exports --sleep=3 --tries=2 --timeout=900 --memory=512 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=deploy
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/mobilitycloud/storage/logs/exports-worker.log
stopwaitsecs=960
